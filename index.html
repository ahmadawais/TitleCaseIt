<body>

<h1>
	TitleCase It! <i>v 3.0</i>
	<div class="aa_h1__inner">
		by <a href="http://AhmadAwais.com/about/" target="_blank">Ahmad Awais.</a>
		<span>If you like this, you'd love <a class="aa_accent_link" href="https://AhmadAwais.com/courses" target="_blank">Courses by Awais</a>!</span>
	</div>
</h1>

<form class="aa_case">

	<div class="input_wrap">
		<input
			id="nonconverted"
			class="aa_case__untitled input_field"
			type="text"
			tabindex="1"
			placeholder="the quick brown fox jumps over the lazy dog"
			autocomplete="off"
			autocorrect="off"
			spellcheck="false"
		 />
	</div>

	<div class="aa_case__arrow" aria-hidden="true"></div>

	<div class="aa_case__convert">
		<div class="input_wrap aa_case__output_wrap">
			<input
				id="converted"
				class="aa_case__display input_field"
				placeholder="The Quick Brown Fox Jumps Over the Lazy Dog"
				readonly
				/>
			<div id="copiedToast" class="aa_toast">Copied!</div>
		</div>

		<p class="aa_case__copy">
			<span>TIP</span> Auto-copies to clipboard. Press <span>Enter</span> to copy now.
		</p>
	</div>
</form>

<script src="main.js?v=3.1.0"></script>
</body>
